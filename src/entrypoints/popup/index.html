<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>UI Tweaks for Xero</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            width: 280px;
            max-height: 600px;
            overflow-y: auto;
            margin: 0;
            padding: 12px;
        }

        h1 {
            font-size: 14px;
            margin: 0 0 8px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            padding: 4px 0;
        }

        h2 {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #888;
            margin: 10px 0 2px;
        }

        h2:first-child {
            margin-top: 0;
        }

        .mode-control {
            justify-content: space-between;
        }

        .mode-control select {
            flex: 1;
            max-width: 165px;
        }

        .appearance-control {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 2px 8px;
        }

        .appearance-control input {
            grid-column: 1 / -1;
            width: 100%;
            margin: 0;
        }

        .appearance-control output {
            color: #666;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
<h1>UI Tweaks for Xero</h1>
<div id="toggles"></div>
<script type="module" src="main.ts"></script>
</body>
</html>
